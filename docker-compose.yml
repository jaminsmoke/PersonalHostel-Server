services:
  db:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hosteleria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devlocal}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/identity/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hosteleria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-devlocal}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-devlocal}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity-camareros:
    build:
      context: ./services/identity
      target: runtime
    ports:
      - "${IDENTITY_PORT:-8080}:8080"
    environment:
      CAMAREROS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_camareros
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_negocio
      SESSION_SECRET: ${SESSION_SECRET:-BdZh-Awc4rEhsHCtzyUoufxqf7mT97y68QhilC9fxVnszS4CFmICrNRncw7vVeN2}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-osYIdBW7fkucKVqY9St5yQKpLpDuAzJ4PeRaFMXbtDI=}
      FOTOS_DIR: /app/data/fotos
      INTERNAL_TRANSPORT: http
      NEGOCIO_INTERNAL_URL: http://identity-negocio:8081
      ALLOW_NON_REAL_DATA: ${ALLOW_NON_REAL_DATA:-true}
      IDENTITY_WEB_ORIGIN: ${IDENTITY_WEB_ORIGIN:-http://localhost:8084,https://web.camareros.siberia.solutions}
      FICHA_URL_BASE: ${FICHA_URL_BASE:-http://localhost:8084}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devlocal}@redis:6379/0
    volumes:
      - fotos:/app/data/fotos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      fotos-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  identity-negocio:
    build:
      context: ./services/identity
      target: runtime
    ports:
      - "${NEGOCIO_PORT:-8082}:8080"
    environment:
      SERVICE: negocio
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_negocio
      CAMAREROS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_camareros
      SESSION_SECRET: ${SESSION_SECRET:-BdZh-Awc4rEhsHCtzyUoufxqf7mT97y68QhilC9fxVnszS4CFmICrNRncw7vVeN2}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-osYIdBW7fkucKVqY9St5yQKpLpDuAzJ4PeRaFMXbtDI=}
      FOTOS_DIR: /app/data/fotos
      INTERNAL_TRANSPORT: http
      CAMAREROS_INTERNAL_URL: http://identity-camareros:8081
      IDENTITY_WEB_ORIGIN: ${IDENTITY_WEB_ORIGIN:-http://localhost:8083,http://localhost:8084,http://localhost:8085,https://web.negocio.siberia.solutions,https://web.camareros.siberia.solutions,https://web.mesa.siberia.solutions}
      INVITATION_URL_BASE: ${INVITATION_URL_BASE:-http://localhost:8084/invitaciones}
      WEB_NEGOCIO_URL_BASE: ${WEB_NEGOCIO_URL_BASE:-http://localhost:8083}
      WEB_CFC_URL_BASE: ${WEB_CFC_URL_BASE:-http://localhost:8085}
      ALLOW_NON_REAL_DATA: ${ALLOW_NON_REAL_DATA:-true}
      REDIS_URL: redis://:${REDIS_PASSWORD:-devlocal}@redis:6379/0
    volumes:
      - fotos:/app/data/fotos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      fotos-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  email-worker:
    build:
      context: ./services/identity
      target: runtime
    environment:
      SERVICE: email-worker
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_negocio
      SESSION_SECRET: ${SESSION_SECRET:-BdZh-Awc4rEhsHCtzyUoufxqf7mT97y68QhilC9fxVnszS4CFmICrNRncw7vVeN2}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.test}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    depends_on:
      identity-negocio:
        condition: service_healthy

  fotos-permissions:
    build:
      context: ./services/identity
      target: runtime
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /app/data/fotos"]
    volumes:
      - fotos:/app/data/fotos
    restart: "no"

  reports-permissions:
    profiles: ["test"]
    build:
      context: ./services/identity
      target: runtime
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /reports"]
    volumes:
      - ./build/reports:/reports
    restart: "no"

  identity-tests:
    profiles: ["test"]
    build:
      context: ./services/identity
      target: test
    environment:
      CAMAREROS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_camareros
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:-devlocal}@db:5432/identity_negocio
      SESSION_SECRET: ${SESSION_SECRET:-BdZh-Awc4rEhsHCtzyUoufxqf7mT97y68QhilC9fxVnszS4CFmICrNRncw7vVeN2}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:-osYIdBW7fkucKVqY9St5yQKpLpDuAzJ4PeRaFMXbtDI=}
      FOTOS_DIR: /tmp/identity-test-fotos
      OPENAPI_DOCS_DIR: /docs
      RUFF_CACHE_DIR: /tmp/ruff-cache
      PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest-cache
      COVERAGE_FILE: /tmp/.coverage
      INTERNAL_TRANSPORT: direct
      ALLOW_NON_REAL_DATA: "true"
      WEB_NEGOCIO_URL_BASE: http://localhost:8083
      WEB_CFC_URL_BASE: http://localhost:8085
      REDIS_URL: redis://:${REDIS_PASSWORD:-devlocal}@redis:6379/0
      RATE_LIMIT_LOGIN_IP: "10000"
      RATE_LIMIT_LOGIN_EMAIL: "10000"
      RATE_LIMIT_REGISTRO_IP: "10000"
      RATE_LIMIT_UPLOAD_CUENTA: "10000"
      RATE_LIMIT_CFC_MESA: "10000"
    command:
      - python
      - -m
      - pytest
      - tests
      - -v
      - --junitxml=/reports/junit.xml
      - --cov=app
      - --cov-branch
      - --cov-report=term-missing
      - --cov-report=xml:/reports/coverage.xml
      - --cov-report=html:/reports/htmlcov
      - --cov-report=markdown:/reports/coverage.md
    volumes:
      - ./services/identity:/app
      - ./docs:/docs:ro
      - ./build/reports:/reports
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      reports-permissions:
        condition: service_completed_successfully

  web-negocio:
    build: ./services/web-negocio
    environment:
      NEGOCIO_API_URL: ${NEGOCIO_API_URL:-http://localhost:8082}
    depends_on:
      identity-negocio:
        condition: service_healthy

  web-camareros:
    build: ./services/web-camareros
    environment:
      CAMAREROS_API_URL: ${CAMAREROS_API_URL:-http://localhost:8080}
      NEGOCIO_API_URL: ${NEGOCIO_API_URL:-http://localhost:8082}
    depends_on:
      identity-camareros:
        condition: service_healthy

  web-cfc:
    build: ./services/web-cfc
    environment:
      NEGOCIO_API_URL: ${NEGOCIO_API_URL:-http://localhost:8082}
    depends_on:
      identity-negocio:
        condition: service_healthy

  # Cabeceras de las webs públicas. En local publica 8083/8084/8085 (DX).
  # En prod el override mueve el borde a 9083-9085 y deja nginx en 8083-8085.
  web-edge:
    build: ./deploy/web-edge
    ports:
      - "${WEB_NEGOCIO_PORT:-8083}:9083"
      - "${WEB_CAMAREROS_PORT:-8084}:9084"
      - "${WEB_CFC_PORT:-8085}:9085"
    environment:
      NEGOCIO_API_URL: ${NEGOCIO_API_URL:-http://localhost:8082}
      CAMAREROS_API_URL: ${CAMAREROS_API_URL:-http://localhost:8080}
    depends_on:
      web-negocio:
        condition: service_started
      web-camareros:
        condition: service_started
      web-cfc:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9083/health >/dev/null && wget -qO- http://127.0.0.1:9084/health >/dev/null && wget -qO- http://127.0.0.1:9085/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s

volumes:
  pgdata:
  fotos:
