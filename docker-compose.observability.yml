# Stack de observabilidad (SOLO staging/producción). Se apila encima de los
# otros dos ficheros. Preferir el wrapper (anti-orphan):
#   bash services/identity/scripts/obs_up.sh up
# Equivalente:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.observability.yml up -d
#
# No forma parte del `docker compose up --build` de desarrollo.
# Nunca hagas `compose down` sin este tercer -f: Docker borra la pila.
#
# Piezas: Prometheus (métricas + reglas), Alertmanager (email), Grafana
# (dashboards), Loki + Alloy (logs de contenedores), node_exporter (host) y
# postgres_exporter (BD). Todo bind a 127.0.0.1; solo Grafana se expone por
# Caddy (con basic_auth). Las APIs no publican /metrics por Caddy: viven en
# el listener interno `:8081` y Prometheus las raspa por la red Docker.
#
# Nota de alcance: sin cadvisor (evita montar /var/run/docker.sock en el VPS);
# las métricas de host las da node_exporter y las de contenedor las /metrics de
# las propias APIs.

services:
  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./services/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    entrypoint: ["sh", "/etc/alertmanager/entrypoint.sh"]
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./services/observability/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    environment:
      ALERTMANAGER_ROUTE_TO: ${ALERTMANAGER_ROUTE_TO:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:?EMAIL_PASSWORD es obligatorio para observabilidad}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.test}

  grafana:
    image: grafana/grafana:13.1.4
    restart: unless-stopped
    ports:
      # 3001 en el host porque 3000 lo usa la landing siberia.solutions.
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD es obligatorio}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 256M

  loki:
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./services/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    deploy:
      resources:
        limits:
          memory: 256M

  alloy:
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    # Fase B: config nativa .river (generada con `alloy convert -f=promtail`).
    # El checkpoint vive en el volumen alloy-data (--storage.path); el id del
    # componente loki.source.file.containers es el mismo que en la fase A, así
    # que se continúa desde la misma posición sin reenvíos.
    command: run /etc/alloy/config.river --storage.path=/var/lib/alloy/data
    volumes:
      - ./services/observability/alloy/config.river:/etc/alloy/config.river:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./backups/metrics:/textfile:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/containers)($|/)
    deploy:
      resources:
        limits:
          memory: 64M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio para observabilidad}@db:5432/identity_negocio?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
