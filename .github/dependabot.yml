version: 2
updates:
  - package-ecosystem: pip
    directory: /services/identity
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, security]
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /services/identity
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, security]

  - package-ecosystem: docker
    directory: /deploy/caddy
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, security]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, security]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: [dependencies, security]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/web-negocio
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-web-negocio:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/web-camareros
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-web-camareros:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /services/web-cfc
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-web-cfc:
        patterns: ["*"]
