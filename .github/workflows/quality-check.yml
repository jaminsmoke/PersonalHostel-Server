name: Quality check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/identity/requirements*.txt
      - name: Install quality dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check --output-format=github app tests scripts
      - name: Check Python formatting
        run: ruff format --check app tests scripts
      - name: Check OpenAPI specs are in sync
        run: python scripts/export_openapi.py --check

  web-negocio:
    name: web-negocio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-negocio
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web-negocio/package-lock.json
      - name: Install and build SPA
        run: |
          npm ci
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -F "can't be bundled without type=\"module\"" build.log; then
            echo "::error::Vite still warns about /config.js; keep vite-ignore on the runtime script."
            exit 1
          fi
          grep -Eq '<script[^>]*src="/config.js"' dist/index.html
          if grep -E '<script[^>]*vite-ignore' dist/index.html; then
            echo "::error::vite-ignore leaked into dist/index.html"
            exit 1
          fi

  web-cfc:
    name: web-cfc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-cfc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web-cfc/package-lock.json
      - name: Install, test and build SPA
        run: |
          npm ci
          npm test
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -F "can't be bundled without type=\"module\"" build.log; then
            echo "::error::Vite still warns about /config.js; keep vite-ignore on the runtime script."
            exit 1
          fi
          grep -Eq '<script[^>]*src="/config.js"' dist/index.html
          if grep -E '<script[^>]*vite-ignore' dist/index.html; then
            echo "::error::vite-ignore leaked into dist/index.html"
            exit 1
          fi

  identity-edge:
    name: identity-edge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sidecar and validate Caddyfile
        run: |
          docker build --tag personalhostel/identity-edge:ci deploy/caddy
          docker run --rm personalhostel/identity-edge:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  web-edge:
    name: web-edge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sidecar, validate Caddyfile and check headers
        run: |
          docker build --tag personalhostel/web-edge:ci deploy/web-edge
          docker run --rm personalhostel/web-edge:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          WEB_EDGE_IMAGE=personalhostel/web-edge:ci bash deploy/web-edge/check_headers.sh
