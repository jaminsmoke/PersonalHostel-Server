name: Security check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.29.0@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  POSTGRES_IMAGE: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: services/identity/requirements*.txt

      - name: Prepare security workspace
        run: mkdir -p build/security/trivy-cache

      - name: Validate workflow syntax
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          --workdir /repo
          "$ACTIONLINT_IMAGE"

      - name: Audit workflow security
        run: >-
          docker run --rm
          --volume "$PWD:/repo:ro"
          --workdir /repo
          "$ZIZMOR_IMAGE"
          --persona=auditor .github/workflows

      - name: Audit Python dependencies
        run: |
          python -m pip install -r services/identity/requirements-security.txt
          pip-audit --progress-spinner=off --format=json \
            --output=build/security/pip-audit-runtime.json \
            --requirement=services/identity/requirements.txt || test -s build/security/pip-audit-runtime.json
          pip-audit --progress-spinner=off --format=json \
            --output=build/security/pip-audit-development.json \
            --requirement=services/identity/requirements-dev.txt || test -s build/security/pip-audit-development.json

      - name: Build deployable images once
        run: |
          docker build --target runtime --tag personalhostel/identity-runtime:ci services/identity
          docker pull "$POSTGRES_IMAGE"
          docker tag "$POSTGRES_IMAGE" personalhostel/postgres:ci
          docker save --output build/security/identity-runtime.tar personalhostel/identity-runtime:ci
          docker save --output build/security/postgres.tar personalhostel/postgres:ci

      - name: Scan images and generate SPDX SBOMs
        run: |
          for image in identity-runtime postgres; do
            docker run --rm \
              --volume "$PWD/build/security:/security" \
              "$TRIVY_IMAGE" image --cache-dir /security/trivy-cache \
              --input "/security/$image.tar" --scanners vuln \
              --format json --output "/security/$image.trivy.json"
            docker run --rm \
              --volume "$PWD/build/security:/security" \
              "$TRIVY_IMAGE" image --cache-dir /security/trivy-cache \
              --input "/security/$image.tar" --scanners vuln \
              --format sarif --output "/security/$image.trivy.sarif"
            docker run --rm \
              --volume "$PWD/build/security:/security" \
              "$TRIVY_IMAGE" image --cache-dir /security/trivy-cache \
              --input "/security/$image.tar" \
              --format spdx-json --output "/security/$image.spdx.json"
          done

      - name: Scan repository configuration
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --volume "$PWD/build/security:/security" \
            "$TRIVY_IMAGE" config --cache-dir /security/trivy-cache /repo \
            --format json --output /security/config.trivy.json
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --volume "$PWD/build/security:/security" \
            "$TRIVY_IMAGE" config --cache-dir /security/trivy-cache /repo \
            --format sarif --output /security/config.trivy.sarif

      - name: Enforce versioned security policy
        run: |
          set -o pipefail
          python services/identity/scripts/check_security_policy.py \
            --exceptions security/exceptions.json \
            --pip-audit-report build/security/pip-audit-runtime.json \
            --pip-audit-report build/security/pip-audit-development.json \
            --trivy-report build/security/identity-runtime.trivy.json \
            --trivy-report build/security/postgres.trivy.json \
            --trivy-report build/security/config.trivy.json \
            | tee build/security/policy-summary.txt

      - name: Publish security summary
        if: always()
        run: |
          if [ -f build/security/policy-summary.txt ]; then
            cat build/security/policy-summary.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove ephemeral image archives
        if: always()
        run: rm -f build/security/*.tar

      - name: Upload security reports and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-security-reports
          path: |
            build/security/*.json
            build/security/*.sarif
            build/security/*.txt
          if-no-files-found: warn
          retention-days: 30
