name: Integration check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare report directory
        run: mkdir -p build/reports && chmod 0777 build/reports
      - name: Build and start Identity with PostgreSQL 16
        run: docker compose up -d --build identity-camareros identity-negocio
      - name: Build isolated test runner
        run: docker compose build identity-tests
      - name: Run tests with branch coverage
        run: docker compose run --rm identity-tests
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f build/reports/coverage.md ]; then
            cat build/reports/coverage.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Audit the clean development databases
        run: docker compose exec -T identity-camareros python -m app.data_audit --format json --fail-on-detected
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: identity-test-reports
          path: build/reports
          if-no-files-found: warn
          retention-days: 14
      - name: Stop ephemeral services
        if: always()
        run: docker compose down -v
