# Override para staging/producción (VPS). Se aplica encima de docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Diferencias con dev:
#   - Las APIs y la web publican SOLO en 127.0.0.1 (Caddy las expone por 80/443).
#     Esto evita que Docker eluda UFW publicando en 0.0.0.0.
#   - Postgres y Redis NO publican puerto (solo red interna Docker).
#   - El resto (secretos, ALLOW_NON_REAL_DATA=false, URLs públicas) se controla
#     con el `.env` del VPS, no aquí.
services:
  db:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}

  redis:
    ports: !reset []
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio en producción}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio en producción}
      - --save
      - ""
      - --appendonly
      - "no"

  identity-camareros:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      CAMAREROS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}@db:5432/identity_camareros
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}@db:5432/identity_negocio
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET es obligatorio en producción}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:?QR_SIGNING_KEY es obligatorio en producción}
      ALLOW_NON_REAL_DATA: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio en producción}@redis:6379/0

  identity-negocio:
    ports: !override
      - "127.0.0.1:8082:8080"
    environment:
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}@db:5432/identity_negocio
      CAMAREROS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}@db:5432/identity_camareros
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET es obligatorio en producción}
      QR_SIGNING_KEY: ${QR_SIGNING_KEY:?QR_SIGNING_KEY es obligatorio en producción}
      ALLOW_NON_REAL_DATA: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD es obligatorio en producción}@redis:6379/0

  email-worker:
    environment:
      NEGOCIO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hosteleria}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio en producción}@db:5432/identity_negocio
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET es obligatorio en producción}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:?EMAIL_PASSWORD es obligatorio en producción}

  web-negocio:
    ports: !override
      - "127.0.0.1:8083:8080"

  web-camareros:
    ports: !override
      - "127.0.0.1:8084:8080"

  web-cfc:
    ports: !override
      - "127.0.0.1:8085:8080"

  web-edge:
    ports: !override
      - "127.0.0.1:9083:9083"
      - "127.0.0.1:9084:9084"
      - "127.0.0.1:9085:9085"

  # Borde de abuso (rate_limit). El Caddy vanilla del host hace TLS y
  # reverse_proxy a estos puertos; las APIs siguen en :8080/:8082 (rollback).
  identity-edge:
    build:
      context: ./deploy/caddy
    ports:
      - "127.0.0.1:9080:9080"
      - "127.0.0.1:9082:9082"
    depends_on:
      identity-camareros:
        condition: service_healthy
      identity-negocio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9080/health >/dev/null && wget -qO- http://127.0.0.1:9082/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 5s
